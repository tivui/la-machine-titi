# SPDX-License-Identifier: Apache-2.0
#
# Build a custom firmware image from a ChoreographyTheme in La Machine Studio.
# Triggered by the triggerBuild Lambda via workflow_dispatch.
#
# Prerequisites (one-time S3 setup):
#   Run the standard build.yaml → download "la_machine-atomvm" artifact
#   → upload to S3 firmware-base/:
#     firmware-base/bootloader.bin
#     firmware-base/atomvm-esp32.bin
#     firmware-base/mkimage.erl
#   Run: python $IDF_PATH/.../gen_esp32part.py image/partitions.csv image/partitions.bin
#   → upload to S3 firmware-base/partitions.bin
#
# Required secrets:
#   Repository level: AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY, AWS_REGION
#   Per GitHub Environment (sandbox + production):
#     AMPLIFY_API_ENDPOINT  — AppSync GraphQL URL
#     AMPLIFY_API_KEY       — AppSync public API key
#     S3_BUCKET             — Amplify Storage bucket name

name: Build Custom Firmware

on:
  workflow_dispatch:
    inputs:
      theme_id:
        description: 'ID of the ChoreographyTheme (DynamoDB)'
        required: true
      theme_name:
        description: 'Display name of the theme'
        required: true
      choreographies_b64:
        description: 'Base64-encoded choreographies.json  { [name]: erlangString }'
        required: true
      build_job_id:
        description: 'BuildJob record ID to update in AppSync'
        required: true
      environment:
        description: 'GitHub Environment to use (sandbox | production)'
        required: true
        default: production

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_DEFAULT_REGION: ${{ secrets.AWS_REGION }}

jobs:
  build:
    runs-on: ubuntu-24.04
    container: erlang:28
    environment: ${{ inputs.environment }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: custom/mes_sons

      - name: Install tools
        run: |
          apt-get update -q
          apt-get install -y -q awscli curl jq

      - name: Mark build as running
        run: |
          curl -sf -X POST "${{ secrets.AMPLIFY_API_ENDPOINT }}" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.AMPLIFY_API_KEY }}" \
            -d "$(jq -n \
              --arg jobId "${{ inputs.build_job_id }}" \
              --arg runId "${{ github.run_id }}" \
              '{query: "mutation UpdateBuildJob($input: UpdateBuildJobInput!) { updateBuildJob(input: $input) { id } }",
                variables: {input: {id: $jobId, status: "running", workflowRunId: $runId}}}')"

      - name: Generate choreographies.json
        run: |
          # Merge custom choreographies into the original file.
          # Original has 170+ scenarios (system, calling, meuh, hits…) — we keep them all
          # and override/add the theme's custom scenarios on top.
          echo "${{ inputs.choreographies_b64 }}" | base64 -d > custom_choreos.json
          jq -s '.[0] * .[1]' choreographies.json custom_choreos.json > merged.json
          mv merged.json choreographies.json
          echo "Total scenarios after merge: $(jq 'keys | length' choreographies.json)"
          echo "Custom scenarios added:"
          jq 'keys' custom_choreos.json

      - name: Sync sounds from S3
        run: |
          # Sync all non-personal sounds (system, original — meuh, calling, joy, hits, _other, _system)
          aws s3 sync "s3://${{ secrets.S3_BUCKET }}/sounds/" sounds/ --exclude "personal/*"

          # Only sync personal sounds actually referenced in the custom choreographies
          REFERENCED=$(jq -r '[.[] | scan("personal/[^\"\\\\]+\\.mp3")] | unique[]' custom_choreos.json || true)
          if [ -n "$REFERENCED" ]; then
            mkdir -p sounds/personal
            while IFS= read -r path; do
              echo "Syncing referenced sound: $path"
              aws s3 cp "s3://${{ secrets.S3_BUCKET }}/sounds/$path" "sounds/$path" || \
                echo "WARNING: $path not found in S3 — choreography will have no audio"
            done <<< "$REFERENCED"
          else
            echo "No personal sounds referenced in this theme's choreographies"
          fi
          echo "Sounds synced: $(find sounds/ -name '*.mp3' | wc -l) files"

      - name: Compile (generates sounds.bin + HRL)
        run: rebar3 compile

      - name: Package AVM with atomvmlib
        run: rebar3 atomvm packbeam -p -e ./atomvmlib.avm

      - name: Download VM artifacts from S3 firmware-base/
        run: |
          mkdir -p image/build/bootloader
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/firmware-base/bootloader.bin" image/build/bootloader/bootloader.bin
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/firmware-base/atomvm-esp32.bin" image/build/atomvm-esp32.bin
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/firmware-base/partitions.bin" image/partitions.bin
          aws s3 cp "s3://${{ secrets.S3_BUCKET }}/firmware-base/mkimage.erl" image/mkimage.erl
          ls -lh image/build/ image/partitions.bin image/mkimage.erl

      - name: Assemble image directory
        run: |
          cp _build/default/lib/la_machine.avm image/la_machine.avm
          cp _build/generated/sounds.bin image/sounds.bin
          ls -lh image/

      - name: Build firmware image
        working-directory: image
        run: |
          escript mkimage.erl --root_dir . --config mkimage.config --out la_machine.img
          ls -lh la_machine.img
          SIZE_KB=$(du -k la_machine.img | cut -f1)
          echo "IMAGE_SIZE_KB=$SIZE_KB" >> "$GITHUB_ENV"

      - name: Upload firmware image to S3
        run: |
          aws s3 cp image/la_machine.img \
            "s3://${{ secrets.S3_BUCKET }}/images/${{ inputs.theme_id }}/la_machine.img"

      - name: Mark build as success + upsert ImageTheme + create Sound records
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          IMAGE_S3_KEY="images/${{ inputs.theme_id }}/la_machine.img"
          EP="${{ secrets.AMPLIFY_API_ENDPOINT }}"
          KEY="${{ secrets.AMPLIFY_API_KEY }}"
          THEME_ID="${{ inputs.theme_id }}"

          # 1. Update BuildJob → success
          curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
            -d "$(jq -n \
              --arg jobId "${{ inputs.build_job_id }}" --arg now "$NOW" --arg s3key "$IMAGE_S3_KEY" \
              '{query:"mutation U($i:UpdateBuildJobInput!){updateBuildJob(input:$i){id}}",
                variables:{i:{id:$jobId,status:"success",completedAt:$now,imageS3Key:$s3key}}}')"

          # 2. Upsert ImageTheme — évite les doublons sur les rebuilds successifs
          EXISTING_ID=$(curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
            -d "$(jq -n --arg tid "$THEME_ID" \
              '{query:"query L($tid:ID){listImageThemes(filter:{choreographyThemeId:{eq:$tid}}){items{id}}}",
                variables:{tid:$tid}}')" \
            | jq -r '.data.listImageThemes.items[0].id // empty')

          if [ -n "$EXISTING_ID" ]; then
            echo "Updating existing ImageTheme: $EXISTING_ID"
            curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
              -d "$(jq -n \
                --arg id "$EXISTING_ID" --arg name "${{ inputs.theme_name }}" \
                --arg s3key "$IMAGE_S3_KEY" --arg now "$NOW" --argjson sizeKb "$IMAGE_SIZE_KB" \
                '{query:"mutation U($i:UpdateImageThemeInput!){updateImageTheme(input:$i){id}}",
                  variables:{i:{id:$id,name:$name,s3Key:$s3key,buildDate:$now,sizeKb:$sizeKb}}}')"
            IMAGE_THEME_ID="$EXISTING_ID"

            # Supprimer les anciens Sound records avant de les recréer
            OLD_IDS=$(curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
              -d "$(jq -n --arg id "$IMAGE_THEME_ID" \
                '{query:"query L($id:ID){listSounds(filter:{imageThemeId:{eq:$id}}){items{id}}}",
                  variables:{id:$id}}')" \
              | jq -r '.data.listSounds.items[].id')
            for sid in $OLD_IDS; do
              curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
                -d "$(jq -n --arg id "$sid" \
                  '{query:"mutation D($i:DeleteSoundInput!){deleteSound(input:$i){id}}",
                    variables:{i:{id:$id}}}')"
            done
          else
            echo "Creating new ImageTheme"
            IMAGE_THEME_ID=$(curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
              -d "$(jq -n \
                --arg name "${{ inputs.theme_name }}" --arg s3key "$IMAGE_S3_KEY" \
                --arg themeId "$THEME_ID" --arg now "$NOW" --argjson sizeKb "$IMAGE_SIZE_KB" \
                '{query:"mutation C($i:CreateImageThemeInput!){createImageTheme(input:$i){id}}",
                  variables:{i:{name:$name,s3Key:$s3key,choreographyThemeId:$themeId,
                                buildDate:$now,isOriginal:false,sizeKb:$sizeKb}}}')" \
              | jq -r '.data.createImageTheme.id')
            echo "Created ImageTheme: $IMAGE_THEME_ID"
          fi

          # 3. Créer un Sound record uniquement pour les sons personnels référencés dans les chorés du thème
          if [ -n "$IMAGE_THEME_ID" ]; then
            REFERENCED=$(jq -r '[.[] | scan("personal/[^\"\\\\]+\\.mp3")] | unique[]' custom_choreos.json || true)
            if [ -n "$REFERENCED" ]; then
              while IFS= read -r personal_path; do
                [ -n "$personal_path" ] || continue
                filename=$(basename "$personal_path")
                sname=$(echo "${filename%.mp3}" | sed 's/[-_]/ /g')
                curl -sf -X POST "$EP" -H "Content-Type: application/json" -H "x-api-key: $KEY" \
                  -d "$(jq -n \
                    --arg imgId "$IMAGE_THEME_ID" --arg name "$sname" --arg fn "$personal_path" \
                    '{query:"mutation C($i:CreateSoundInput!){createSound(input:$i){id}}",
                      variables:{i:{imageThemeId:$imgId,name:$name,filename:$fn,isSystem:false}}}')"
                echo "Sound record created: $personal_path"
              done <<< "$REFERENCED"
            else
              echo "No personal Sound records to create for this theme"
            fi
          fi

      - name: Mark build as failed
        if: failure()
        run: |
          NOW=$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")
          curl -sf -X POST "${{ secrets.AMPLIFY_API_ENDPOINT }}" \
            -H "Content-Type: application/json" \
            -H "x-api-key: ${{ secrets.AMPLIFY_API_KEY }}" \
            -d "$(jq -n \
              --arg jobId "${{ inputs.build_job_id }}" \
              --arg now "$NOW" \
              --arg runId "${{ github.run_id }}" \
              '{query: "mutation UpdateBuildJob($input: UpdateBuildJobInput!) { updateBuildJob(input: $input) { id } }",
                variables: {input: {id: $jobId, status: "failed", completedAt: $now,
                                    errorMessage: ("GitHub Actions run " + $runId + " failed — check workflow logs.")}}}')" || true
